[package]
name = "md_tauri"
version = "0.1.0"
edition = "2024"

[dependencies]
pulldown-cmark = "0.13.6"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2.12.6"
tauri-plugin-opener = "2.7.3"

[build-dependencies]
tauri-build = "2.7.5"

# Dépendances compilées sans infos de débogage en dev : la crate `windows`
# faisait planter rustc par manque de mémoire (STATUS_STACK_BUFFER_OVERRUN).
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
