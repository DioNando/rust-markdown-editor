<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Éditeur Markdown</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Barre de titre maison : data-tauri-drag-region = zone pour déplacer la fenêtre
       (double-clic = agrandir). Seuls les éléments portant l'attribut sont « attrapables ». -->
  <header class="toolbar" data-tauri-drag-region>
    <div class="file" data-tauri-drag-region>
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 1024 1024" fill="currentColor" fill-rule="evenodd"><g transform="rotate(40 512 512) translate(512 512) scale(0.98) translate(-512 -532)"><path d="M512 92C430 150 362 246 344 352L408 350L336 412C326 470 330 524 348 574L410 562L356 624C380 680 424 728 498 768L498 928Q512 972 526 928L526 768C596 732 640 684 664 628L606 630L672 570C688 520 692 466 684 410L622 424L680 352C660 248 596 152 512 92ZM506 250L518 250L518 748L506 748Z"/></g></svg></span>
      <span id="filename" data-tauri-drag-region>Sans titre</span>
      <span id="dirty" class="dirty" title="Modifications non enregistrées" hidden></span>
    </div>

    <nav class="segmented" aria-label="Mode d'affichage du panneau actif">
      <button data-mode="edit" title="Éditer" aria-label="Éditer"><span class="ms">edit</span><span class="lbl">Éditer</span></button>
      <button data-mode="split" title="Côte à côte" aria-label="Côte à côte"><span class="ms">vertical_split</span><span class="lbl">Côte à côte</span></button>
      <button data-mode="preview" title="Lire" aria-label="Lire"><span class="ms">menu_book</span><span class="lbl">Lire</span></button>
    </nav>

    <div class="actions" data-tauri-drag-region>
      <button id="btn-outline" class="btn-ghost icon" title="Plan du document (Ctrl+Maj+O)">
        <span class="ms">toc</span>
      </button>
      <button id="btn-split" class="btn-ghost icon" title="Fractionner la vue (Ctrl+\)">
        <span class="ms">splitscreen_right</span>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button id="btn-open" class="btn-ghost" title="Ouvrir (Ctrl+O)">
        <span class="ms">folder_open</span><span class="lbl">Ouvrir</span>
      </button>
      <button id="btn-save-as" class="btn-ghost icon" title="Enregistrer sous (Ctrl+Maj+S)">
        <span class="ms">save_as</span>
      </button>
      <button id="btn-save" class="btn-primary" title="Enregistrer (Ctrl+S)">
        <span class="ms">save</span><span class="lbl">Enregistrer</span>
      </button>
      <button id="btn-more" class="btn-ghost icon" title="Plus : rechercher, exporter, fichiers récents" aria-haspopup="menu">
        <span class="ms">more_horiz</span>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button id="btn-theme" class="btn-ghost icon" title="Changer de thème">
        <span class="ms when-light">dark_mode</span>
        <span class="ms when-dark">light_mode</span>
      </button>
      <div class="window-controls" aria-label="Fenêtre">
        <button id="win-min" title="Réduire" aria-label="Réduire"><span class="ms">remove</span></button>
        <button id="win-max" title="Agrandir" aria-label="Agrandir">
          <span class="ms when-normal">crop_square</span>
          <span class="ms when-max">filter_none</span>
        </button>
        <button id="win-close" title="Fermer" aria-label="Fermer"><span class="ms">close</span></button>
      </div>
    </div>
  </header>

  <!-- Les panneaux (groupes d'onglets) sont créés par main.js à partir du modèle ci-dessous -->
  <main class="workspace" id="workspace">
    <aside id="outline" class="outline card" hidden>
      <div class="outline-head"><span class="ms">toc</span>Plan</div>
      <nav id="outline-list" class="outline-list"></nav>
    </aside>
  </main>

  <!-- Menu « Plus » -->
  <div id="menu" class="menu" role="menu" hidden>
    <button data-cmd="find" role="menuitem"><span class="ms">search</span>Rechercher<kbd>Ctrl+F</kbd></button>
    <button data-cmd="replace" role="menuitem"><span class="ms">find_replace</span>Remplacer<kbd>Ctrl+H</kbd></button>
    <div class="menu-sep"></div>
    <button data-cmd="export-html" role="menuitem"><span class="ms">html</span>Exporter en HTML…</button>
    <button data-cmd="export-pdf" role="menuitem"><span class="ms">picture_as_pdf</span>Exporter en PDF…<kbd>Ctrl+P</kbd></button>
    <div class="menu-sep"></div>
    <div class="menu-title"><span class="ms">history</span>Fichiers récents</div>
    <div id="recent-list" class="recent-list"></div>
  </div>

  <!-- Barre de recherche : déplacée dans le panneau actif à l'ouverture -->
  <div id="findbar" class="findbar" hidden>
    <div class="find-row">
      <span class="ms">search</span>
      <input id="find-input" placeholder="Rechercher" spellcheck="false" autocomplete="off" />
      <span id="find-count" class="find-count"></span>
      <button id="find-case" class="btn-ghost icon" title="Respecter la casse"><span class="ms">match_case</span></button>
      <button id="find-prev" class="btn-ghost icon" title="Précédent (Maj+Entrée)"><span class="ms">arrow_upward</span></button>
      <button id="find-next" class="btn-ghost icon" title="Suivant (Entrée)"><span class="ms">arrow_downward</span></button>
      <button id="find-toggle" class="btn-ghost icon" title="Remplacer (Ctrl+H)"><span class="ms">find_replace</span></button>
      <button id="find-close" class="btn-ghost icon" title="Fermer (Échap)"><span class="ms">close</span></button>
    </div>
    <div class="find-row replace-row">
      <span class="ms">find_replace</span>
      <input id="replace-input" placeholder="Remplacer par" spellcheck="false" autocomplete="off" />
      <button id="replace-one" class="btn-ghost" title="Remplacer (Entrée)">Remplacer</button>
      <button id="replace-all" class="btn-ghost" title="Tout remplacer (Ctrl+Alt+Entrée)">Tout</button>
    </div>
  </div>

  <template id="group-template">
    <section class="group">
      <div class="tabstrip">
        <div class="tabs" role="tablist"></div>
        <button class="tab-new btn-ghost icon" title="Nouvel onglet (Ctrl+T)"><span class="ms">add</span></button>
      </div>
      <div class="group-body" data-mode="split">
        <div class="card editor-pane">
          <pre class="highlight" aria-hidden="true"><code></code></pre>
          <textarea class="editor" spellcheck="false"></textarea>
        </div>
        <div class="divider" title="Glisser pour redimensionner"></div>
        <div class="card preview-pane"><article class="markdown"></article></div>
      </div>
      <div class="drop-zone">
        <div class="drop-card">
          <span class="ms">upload_file</span>
          <strong>Déposer pour ouvrir</strong>
          <span>Fichiers .md, .markdown ou .txt</span>
        </div>
      </div>
    </section>
  </template>

  <footer class="statusbar">
    <span id="status">Prêt — glisse un fichier .md sur la fenêtre pour l'ouvrir</span>
    <span id="stats"></span>
  </footer>

  <dialog id="confirm" class="modal">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="modal-actions" id="confirm-actions"></div>
    </form>
  </dialog>

  <script src="vendor/highlight.min.js"></script>
  <script src="highlight.js"></script>
  <script src="enhance.js"></script>
  <script src="main.js"></script>
</body>
</html>
